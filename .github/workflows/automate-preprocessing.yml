name: Automate Data Preprocessing

on:
  push:
    branches:
      - Master
      - main
    paths:
      - 'namadataset_raw/**'
      - 'preprocessing/automate_Abdurrahman.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r preprocessing/requirements.txt

    - name: Run preprocessing script
      run: python preprocessing/automate_Abdurrahman.py

    - name: Commit and push preprocessed data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add preprocessing/
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated preprocessing by GitHub Actions"
        git push