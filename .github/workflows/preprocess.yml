name: Credit Risk Preprocessing Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'data_raw/**'
      - 'automate_*.py'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn imbalanced-learn joblib
        
    - name: Run preprocessing pipeline
      run: python automate_Abdurrahman.py
      
    - name: Show preprocessing results
      run: |
        echo "Files in preprocessing folder:"
        ls -la preprocessing/
        echo ""
        echo "First 5 rows of X_train.csv:"
        head -5 preprocessing/X_train.csv || echo "File not found"
        
    - name: Upload preprocessing results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: preprocessed-data
        path: preprocessing/
        retention-days: 30
        
    - name: Commit and push results back to repo
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add preprocessing/
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update: preprocessing results [skip ci]"
        git push
      continue-on-error: true
      
    - name: Completion message
      run: |
        echo "========================================"
        echo "✅ PREPROCESSING PIPELINE COMPLETED!"
        echo "========================================"
